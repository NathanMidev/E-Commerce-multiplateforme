# Lancer :  cp .env.example .env   (puis adapter)   et   docker compose up --build
#   API  : http://localhost:8080/api/health
#   Base : 127.0.0.1:5432  (accessible depuis cette machine uniquement)
# Le schéma et les données de démo ne sont chargés qu'à la PREMIÈRE création du volume.
# Pour repartir de zéro :  docker compose down -v

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketplace} -d ${POSTGRES_DB:-marketplace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD:-marketplace}@db:5432/${POSTGRES_DB:-marketplace}
      AUTH_MODE: ${AUTH_MODE:-firebase}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
