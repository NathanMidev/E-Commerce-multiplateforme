# JVM configuration
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# Java 21 from Android Studio JBR
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr

# --- Backend PostgreSQL partage avec la version web (voir backend/README.md)
# Emulateur Android : 10.0.2.2 designe le PC hote. Vrai telephone : http://IP-DU-PC:8080/api/ (meme Wi-Fi)
# ou l'adresse HTTPS du serveur en ligne.
apiBaseUrl=http://10.0.2.2:8080/api/
# true = donnees de demonstration en memoire, sans serveur (demo hors ligne)
useMockBackend=false