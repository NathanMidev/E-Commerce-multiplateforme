plugins {
    id 'com.android.application'
    // Supprimé : id 'org.jetbrains.kotlin.android' (Puisque vous n'utilisez pas Kotlin)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.marketplace.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.marketplace.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            buildConfigField "boolean", "USE_MOCK_BACKEND", "true"
            buildConfigField "String", "API_BASE_URL", "\"https://api.marketplace.com\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

// LE BLOC DEPENDENCIES DOIT ÊTRE ICI (À l'extérieur du bloc android)
dependencies {
    // Dépendances locales
    implementation project(':core:model')
    implementation project(':core:navigation')
    implementation project(':core:network')
    implementation project(':core:database')
    implementation project(':core:firebase')

    // UI et Design
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Firebase (si nécessaire pour Auth/Storage)
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-storage'
    implementation project(':feature:auth')
    implementation project(':feature:products')
    implementation project(':feature:ar3d')
    implementation project(':feature:scanner3d')
    implementation 'com.google.firebase:firebase-components:20.0.0'
    implementation 'com.google.firebase:firebase-appcheck:18.0.0'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}