plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marketplace.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.marketplace.app"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Modules Core
    implementation project(':core:model')
    implementation project(':core:navigation')
    implementation project(':core:network')
    implementation project(':core:database')
    implementation project(':core:firebase')

    // Modules Fonctionnalités (Monolithe Modulaire)
    implementation project(':feature:auth')
    implementation project(':feature:products')
    implementation project(':feature:ar3d')
    implementation project(':feature:scanner3d')
    implementation project(':feature:chat')

    // AndroidX & Material Design
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // Tests unitaires & grand test d'intégration
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
